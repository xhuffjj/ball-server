syntax="proto2"; 
package GameData;

message role_message{
    optional int32 coin=1[default=0];
    optional int32 level=2[default=1];
    optional int32 exp=3[default=0];
    optional int32 vip_level=4[default=0];
    optional int32 last_login_time=5[default=0];
    optional int32 rank_score=6[default=1000];
}